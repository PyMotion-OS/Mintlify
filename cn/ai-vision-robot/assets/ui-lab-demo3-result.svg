<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300">
  <rect width="480" height="300" fill="#1e293b"/>
  <text x="240" y="24" fill="#94a3b8" font-size="13" text-anchor="middle" font-family="sans-serif">摄像头帧（demo3 结果占位图）</text>
  <rect x="60" y="50" width="360" height="220" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <!-- 画面中央的目标块 -->
  <rect x="200" y="120" width="80" height="80" fill="#2563eb" opacity="0.85"/>
  <!-- 检测框与标签 -->
  <rect x="192" y="112" width="96" height="96" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <rect x="192" y="96" width="86" height="18" fill="#fbbf24"/>
  <text x="235" y="109" fill="#0f172a" font-size="12" text-anchor="middle" font-family="monospace">color: 0.91</text>
  <!-- 中心十字 -->
  <line x1="240" y1="150" x2="256" y2="150" stroke="#22c55e" stroke-width="1.5"/>
  <line x1="240" y1="150" x2="240" y2="166" stroke="#22c55e" stroke-width="1.5"/>
  <circle cx="240" cy="150" r="3" fill="#22c55e"/>
  <text x="70" y="70" fill="#64748b" font-size="11" font-family="monospace">320x240 · 30fps</text>
</svg>
